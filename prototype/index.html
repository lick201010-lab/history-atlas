<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>历史沙盘 · 视觉原型</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --panel-bg: rgba(14, 20, 32, 0.72);
    --panel-border: rgba(120, 160, 220, 0.22);
    --accent: #7fbfff;
    --text: #e6ecf5;
    --text-dim: #8fa0bb;
    --gold: #d8b46a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03060c;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    user-select: none;
  }

  /* 星空背景（底层） */
  #stars-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* 地图容器 */
  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: transparent;
  }
  #map .maplibregl-canvas { background: transparent !important; }

  /* 星空叠层（地图上方，极轻） */
  #stars-overlay {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.55;
  }

  /* 云层 */
  .cloud-layer {
    position: absolute;
    inset: -10%;
    z-index: 4;
    pointer-events: none;
    background-image:
      radial-gradient(ellipse 700px 240px at 18% 28%, rgba(190, 210, 240, 0.16), transparent 65%),
      radial-gradient(ellipse 900px 300px at 72% 55%, rgba(190, 210, 240, 0.13), transparent 65%),
      radial-gradient(ellipse 600px 220px at 45% 82%, rgba(190, 210, 240, 0.11), transparent 65%),
      radial-gradient(ellipse 500px 180px at 88% 18%, rgba(190, 210, 240, 0.10), transparent 65%);
    animation: cloudDrift 90s ease-in-out infinite;
    mix-blend-mode: screen;
    filter: blur(2px);
  }
  .cloud-layer.l2 {
    animation: cloudDrift2 140s ease-in-out infinite;
    background-image:
      radial-gradient(ellipse 1000px 320px at 30% 65%, rgba(160, 190, 230, 0.09), transparent 70%),
      radial-gradient(ellipse 800px 260px at 78% 30%, rgba(160, 190, 230, 0.08), transparent 70%);
    opacity: 0.8;
  }
  @keyframes cloudDrift {
    0%   { transform: translate3d(0, 0, 0); }
    50%  { transform: translate3d(-60px, -25px, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }
  @keyframes cloudDrift2 {
    0%   { transform: translate3d(0, 0, 0); }
    50%  { transform: translate3d(80px, 30px, 0); }
    100% { transform: translate3d(0, 0, 0); }
  }

  /* 标题 */
  .title {
    position: fixed;
    top: 18px;
    left: 22px;
    z-index: 10;
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 6px;
    color: var(--text);
    text-shadow: 0 0 12px rgba(127, 191, 255, 0.4);
  }
  .title .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* 右上角控制 */
  .top-right {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  .btn {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    border-radius: 2px;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(127, 191, 255, 0.3);
  }

  /* 信息面板 */
  .info-panel {
    position: fixed;
    top: 70px;
    right: 16px;
    z-index: 10;
    width: 240px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    padding: 16px;
    border-radius: 2px;
  }
  .info-panel h3 {
    margin: 0 0 12px;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
    font-weight: 400;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 8px;
  }
  .info-panel .year-big {
    font-size: 26px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-shadow: 0 0 16px rgba(216, 180, 106, 0.4);
  }
  .info-panel .count {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .info-panel .count span { color: var(--accent); font-size: 14px; }
  .building-list {
    max-height: 200px;
    overflow-y: auto;
    font-size: 12px;
  }
  .building-list .item {
    padding: 6px 8px;
    margin-bottom: 4px;
    background: rgba(127, 191, 255, 0.06);
    border-left: 2px solid var(--accent);
    cursor: pointer;
    transition: background 0.15s;
  }
  .building-list .item:hover {
    background: rgba(127, 191, 255, 0.15);
  }
  .building-list .item .type {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .building-list .empty {
    color: var(--text-dim);
    font-size: 11px;
    text-align: center;
    padding: 20px;
  }

  /* 时间滑块 */
  .timeline {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: linear-gradient(180deg, transparent, rgba(3, 6, 12, 0.85) 30%);
    padding: 30px 40px 24px;
  }
  .timeline-inner {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    padding: 14px 22px;
    border-radius: 2px;
  }
  .timeline-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .timeline-label {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
  }
  .timeline-year {
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 2px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, rgba(127, 191, 255, 0.2), rgba(216, 180, 106, 0.4));
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(216, 180, 106, 0.7);
    border: 2px solid rgba(3, 6, 12, 0.8);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    border: 2px solid rgba(3, 6, 12, 0.8);
  }
  .timeline-ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-dim);
  }

  /* tooltip */
  .building-tooltip {
    position: fixed;
    z-index: 20;
    background: var(--panel-bg);
    border: 1px solid var(--gold);
    color: var(--text);
    padding: 8px 14px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    backdrop-filter: blur(10px);
    border-radius: 2px;
    box-shadow: 0 0 20px rgba(216, 180, 106, 0.3);
  }
  .building-tooltip .name {
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .building-tooltip .meta {
    font-size: 10px;
    color: var(--text-dim);
  }

  .maplibregl-ctrl-attrib { display: none !important; }
</style>
</head>
<body>

<canvas id="stars-bg"></canvas>
<div id="map"></div>
<canvas id="stars-overlay"></canvas>
<div class="cloud-layer"></div>
<div class="cloud-layer l2"></div>

<div class="title">
  历史沙盘
  <span class="sub">HISTORICAL ATLAS · PROTOTYPE</span>
</div>

<div class="top-right">
  <button class="btn" id="btn-mountain">山脉视角</button>
  <button class="btn" id="btn-reset">重置视角</button>
  <button class="btn" id="btn-north">指南针</button>
</div>

<div class="info-panel">
  <h3>当前时空</h3>
  <div class="year-big" id="year-big">公元 1000</div>
  <div class="count">可见建筑 <span id="count">0</span></div>
  <div class="building-list" id="building-list"></div>
</div>

<div class="timeline">
  <div class="timeline-inner">
    <div class="timeline-header">
      <span class="timeline-label">时间轴 TIMELINE</span>
      <span class="timeline-year" id="year-display">公元 1000</span>
    </div>
    <input type="range" id="time-slider" min="-2000" max="2025" value="1000" step="1" />
    <div class="timeline-ticks">
      <span>公元前 2000</span>
      <span>公元前 1000</span>
      <span>公元 0</span>
      <span>公元 1000</span>
      <span>公元 2025</span>
    </div>
  </div>
</div>

<div class="building-tooltip" id="tooltip">
  <div class="name"></div>
  <div class="meta"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
/* ========== 星空：远景（弱闪烁）+ 近景（慢漂移） ==========
   性能策略：
   - 远景全静止 + 仅 ~12% 星星做缓慢呼吸闪烁
   - 近景做极慢平移（环绕），不闪烁
   - 帧率上限 ~20fps，且 document.hidden 时暂停 */
function makeStarfield(canvas, opts) {
  const ctx = canvas.getContext('2d');
  let stars = [];
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    stars = [];
    const count = Math.floor((W * H) / opts.density);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * opts.maxR + opts.minR,
        baseA: Math.random() * 0.5 + opts.baseAlpha,
        phase: Math.random() * Math.PI * 2,
        // 只有少量星星做闪烁，降低每帧 sin 调用
        twinkles: opts.twinkle && Math.random() < (opts.twinkleRatio || 0.12),
        // 闪烁周期 6-14s，缓慢呼吸
        speed: 0.00045 + Math.random() * 0.0007
      });
    }
    drawStatic();
  }

  // 静态星层一次性绘制到离屏 canvas，作为底图
  const staticCanvas = document.createElement('canvas');
  const staticCtx = staticCanvas.getContext('2d');

  function drawBg(c) {
    if (!opts.bgGradient) return;
    const g = c.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H)/1.2);
    g.addColorStop(0, '#0a1428');
    g.addColorStop(1, '#03060c');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
  }

  function drawStaticStarsTo(c) {
    for (const s of stars) {
      if (s.twinkles) continue; // 闪烁星每帧动态绘制
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      c.fillStyle = `rgba(${opts.color}, ${Math.min(1, s.baseA)})`;
      c.fill();
      if (s.r > 1.2) {
        c.beginPath();
        c.arc(s.x, s.y, s.r * 2.4, 0, Math.PI * 2);
        c.fillStyle = `rgba(${opts.color}, ${s.baseA * 0.10})`;
        c.fill();
      }
    }
  }

  function drawStatic() {
    staticCanvas.width = W;
    staticCanvas.height = H;
    drawBg(staticCtx);
    drawStaticStarsTo(staticCtx);
    if (!opts.twinkle && !opts.drift) {
      // 整层都是静态：直接拷贝
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(staticCanvas, 0, 0);
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // 不需要动画的层直接返回
  if (!opts.twinkle && !opts.drift) return;

  // 动画循环（节流到 ~20fps）
  const driftX = opts.drift?.x || 0; // px/sec
  const driftY = opts.drift?.y || 0;
  let lastDraw = 0;
  const FRAME_MS = 50;
  let lastTime = performance.now();
  let ox = 0, oy = 0;

  function loop(t) {
    if (document.hidden) { requestAnimationFrame(loop); return; }
    const dt = Math.min(100, t - lastTime) / 1000;
    lastTime = t;
    ox = (ox + driftX * dt) % W; if (ox < 0) ox += W;
    oy = (oy + driftY * dt) % H; if (oy < 0) oy += H;

    if (t - lastDraw >= FRAME_MS) {
      lastDraw = t;
      ctx.clearRect(0, 0, W, H);

      // 静态星层（含背景渐变 + 非闪烁星），按漂移偏移绘制两次实现无缝环绕
      if (opts.drift) {
        ctx.drawImage(staticCanvas, ox, oy);
        ctx.drawImage(staticCanvas, ox - W, oy);
        ctx.drawImage(staticCanvas, ox, oy - H);
        ctx.drawImage(staticCanvas, ox - W, oy - H);
      } else {
        ctx.drawImage(staticCanvas, 0, 0);
      }

      // 闪烁星（数量很少）
      if (opts.twinkle) {
        for (const s of stars) {
          if (!s.twinkles) continue;
          const a = s.baseA + Math.sin(t * s.speed + s.phase) * 0.32;
          if (a <= 0) continue;
          const x = opts.drift ? ((s.x + ox) % W + W) % W : s.x;
          const y = opts.drift ? ((s.y + oy) % H + H) % H : s.y;
          ctx.beginPath();
          ctx.arc(x, y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${opts.color}, ${Math.min(1, a)})`;
          ctx.fill();
          if (s.r > 1.0) {
            ctx.beginPath();
            ctx.arc(x, y, s.r * 2.6, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${opts.color}, ${a * 0.15})`;
            ctx.fill();
          }
        }
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

// 远景：密、暗、少量呼吸闪烁、不漂移
makeStarfield(document.getElementById('stars-bg'), {
  density: 5500, minR: 0.2, maxR: 1.0, baseAlpha: 0.22,
  color: '200, 220, 255', bgGradient: true,
  twinkle: true, twinkleRatio: 0.10
});

// 近景：疏、亮、极慢横向漂移、不闪烁（避免和远景闪烁打架）
makeStarfield(document.getElementById('stars-overlay'), {
  density: 17000, minR: 0.4, maxR: 1.5, baseAlpha: 0.42,
  color: '210, 230, 255', bgGradient: false,
  twinkle: false,
  drift: { x: 2.5, y: 0.6 } // 每秒 2.5px 横移、0.6px 下移，环绕屏幕需 ~5 分钟
});

/* ========== 数据 ========== */
const BUILDINGS = [
  { id: 'changan',     name: '长安宫殿',   type: 'palace',    lng: 108.94, lat: 34.34, startYear: -200,  endYear: 907,  color: 0xd8b46a },
  { id: 'pyramid',     name: '吉萨金字塔', type: 'pyramid',   lng: 31.13,  lat: 29.98, startYear: -2560, endYear: 2025, color: 0xe8c98a },
  { id: 'colosseum',   name: '罗马斗兽场', type: 'arena',     lng: 12.49,  lat: 41.89, startYear: 80,    endYear: 2025, color: 0xb89060 },
  { id: 'parthenon',   name: '帕特农神庙', type: 'temple',    lng: 23.73,  lat: 37.97, startYear: -432,  endYear: 2025, color: 0xeae0c8 },
  { id: 'tajmahal',    name: '泰姬陵',     type: 'mausoleum', lng: 78.04,  lat: 27.17, startYear: 1653,  endYear: 2025, color: 0xf0e8dc }
];
const TYPE_CN = { palace: '宫殿', pyramid: '金字塔', temple: '神庙', arena: '竞技场', mausoleum: '陵墓' };

/* ========== 地图样式 ========== */
const darkStyle = {
  version: 8,
  glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
  sources: {
    'osm-tiles': {
      type: 'raster',
      tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
              'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
              'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],
      tileSize: 256,
      attribution: ''
    },
    'terrain-dem': {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      encoding: 'terrarium',
      tileSize: 256,
      maxzoom: 15,
      attribution: '<a href="https://registry.opendata.aws/terrain-tiles/">Terrain Tiles</a>'
    },
    'terrain-dem-shade': {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      encoding: 'terrarium',
      tileSize: 256,
      maxzoom: 15
    }
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': 'rgba(4, 8, 15, 0.0)' } },
    { id: 'base', type: 'raster', source: 'osm-tiles', paint: { 'raster-opacity': 0.86, 'raster-contrast': 0.12, 'raster-saturation': -0.18 } },
    {
      id: 'terrain-shade',
      type: 'hillshade',
      source: 'terrain-dem-shade',
      paint: {
        'hillshade-exaggeration': 0,
        'hillshade-shadow-color': 'rgba(0, 0, 0, 0.72)',
        'hillshade-highlight-color': 'rgba(155, 185, 220, 0.28)',
        'hillshade-accent-color': 'rgba(95, 120, 155, 0.30)'
      }
    }
  ],
  terrain: { source: 'terrain-dem', exaggeration: 0.18 },
  sky: {
    'sky-color': '#0a1428',
    'sky-horizon-blend': 0.5,
    'horizon-color': '#1a2a44',
    'horizon-fog-blend': 0.6,
    'fog-color': '#04080f',
    'fog-ground-blend': 0.1
  }
};

/* ========== 地图初始化 ========== */
// 默认视角：欧亚大陆全景，地中海到喜马拉雅同框，多座建筑首屏可见
const INITIAL_VIEW = { center: [55, 35], zoom: 3.2, pitch: 55, bearing: -22 };
const MOUNTAIN_VIEW = { center: [86.9, 27.99], zoom: 6.2, pitch: 68, bearing: -35 };
const WORLD_TERRAIN_EXAGGERATION = 0.18;
const MOUNTAIN_TERRAIN_EXAGGERATION = 2.6;

const map = new maplibregl.Map({
  container: 'map',
  style: darkStyle,
  center: INITIAL_VIEW.center,
  zoom: INITIAL_VIEW.zoom,
  pitch: INITIAL_VIEW.pitch,
  bearing: INITIAL_VIEW.bearing,
  maxPitch: 75,
  antialias: true,
  attributionControl: false
});

map.dragRotate.enable();
map.touchZoomRotate.enableRotation();
document.getElementById('map').addEventListener('contextmenu', e => e.preventDefault());

function setTerrainMode(mode) {
  const isMountain = mode === 'mountain';
  map.setTerrain({
    source: 'terrain-dem',
    exaggeration: isMountain ? MOUNTAIN_TERRAIN_EXAGGERATION : WORLD_TERRAIN_EXAGGERATION
  });
  if (map.getLayer && map.getLayer('terrain-shade')) {
    map.setPaintProperty('terrain-shade', 'hillshade-exaggeration', isMountain ? 0.75 : 0);
  }
}

document.getElementById('btn-reset').addEventListener('click', () => {
  setTerrainMode('world');
  map.flyTo({ ...INITIAL_VIEW, duration: 1500 });
});
document.getElementById('btn-north').addEventListener('click', () => map.easeTo({ bearing: 0, pitch: 55, duration: 1000 }));
document.getElementById('btn-mountain').addEventListener('click', () => {
  setTerrainMode('mountain');
  map.flyTo({ ...MOUNTAIN_VIEW, duration: 2000 });
});

/* ========== Three.js Custom Layer：建筑 ========== */
const buildingLayer = {
  id: 'buildings-3d',
  type: 'custom',
  renderingMode: '3d',
  _needsAnimTick: false,

  onAdd(map, gl) {
    this.map = map;
    this.camera = new THREE.Camera();
    this.scene = new THREE.Scene();

    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    this.scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffe8c0, 1.0);
    dir.position.set(0.4, -0.7, 1).normalize();
    this.scene.add(dir);
    const blue = new THREE.DirectionalLight(0x6090ff, 0.4);
    blue.position.set(0, 0.7, 0.5).normalize();
    this.scene.add(blue);

    this.meshes = {};
    BUILDINGS.forEach(b => {
      const group = this.makeMesh(b);
      const merc = maplibregl.MercatorCoordinate.fromLngLat([b.lng, b.lat], 0);
      const scale = merc.meterInMercatorCoordinateUnits();
      // 建筑实际尺寸（米）—— 显著放大以保证可见
      const sizeMeters = 260000;
      group.position.set(merc.x, merc.y, merc.z);
      group.scale.set(scale * sizeMeters, scale * sizeMeters, scale * sizeMeters);
      group.rotation.x = Math.PI / 2;
      group.userData = b;
      group.userData.mercatorScale = scale;
      group.visible = true;
      this.scene.add(group);
      this.meshes[b.id] = group;
    });

    this.renderer = new THREE.WebGLRenderer({
      canvas: map.getCanvas(),
      context: gl,
      antialias: true
    });
    this.renderer.autoClear = false;
    this.updateScale();
    map.on('zoom', () => this.updateScale());
  },

  getSizeMeters() {
    if (!this.map) return 260000;
    const zoom = this.map.getZoom();
    if (zoom <= 3.5) return 260000;
    if (zoom >= 6.0) return 80000;
    const t = (zoom - 3.5) / 2.5;
    return 260000 + (80000 - 260000) * t;
  },

  updateScale() {
    if (!this.meshes) return;
    const sizeMeters = this.getSizeMeters();
    Object.values(this.meshes).forEach(mesh => {
      const scale = mesh.userData.mercatorScale * sizeMeters;
      mesh.scale.set(scale, scale, scale);
    });
    if (this.map) this.map.triggerRepaint();
  },

  makeMesh(b) {
    const group = new THREE.Group();
    const color = b.color;
    const mat = new THREE.MeshPhongMaterial({ color, emissive: 0x332211, emissiveIntensity: 0.45, shininess: 35, transparent: false });

    if (b.type === 'pyramid') {
      const geo = new THREE.ConeGeometry(0.7, 1.1, 4);
      const m = new THREE.Mesh(geo, mat);
      m.position.z = 0.55;
      m.rotation.y = Math.PI / 4;
      group.add(m);
    } else if (b.type === 'palace') {
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 0.3), mat);
      base.position.z = 0.15;
      const mid = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 0.5), mat);
      mid.position.z = 0.55;
      const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.6, 4), mat);
      roof.position.z = 1.1;
      roof.rotation.y = Math.PI / 4;
      group.add(base, mid, roof);
    } else if (b.type === 'arena') {
      const outer = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.85, 0.7, 28, 1, true), mat);
      outer.rotation.x = Math.PI / 2;
      outer.position.z = 0.35;
      const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.5, 24, 1, true), mat);
      inner.rotation.x = Math.PI / 2;
      inner.position.z = 0.25;
      group.add(outer, inner);
    } else if (b.type === 'temple') {
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 0.18), mat);
      base.position.z = 0.09;
      group.add(base);
      for (let i = -2; i <= 2; i++) {
        for (const j of [-0.35, 0.35]) {
          const col = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.7, 10), mat);
          col.rotation.x = Math.PI / 2;
          col.position.set(i * 0.26, j, 0.53);
          group.add(col);
        }
      }
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 0.12), mat);
      roof.position.z = 0.94;
      const pediment = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.25, 3), mat);
      pediment.rotation.x = Math.PI / 2;
      pediment.position.z = 1.12;
      group.add(roof, pediment);
    } else if (b.type === 'mausoleum') {
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 0.22), mat);
      base.position.z = 0.11;
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.75, 0.35), mat);
      body.position.z = 0.4;
      const dome = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 14, 0, Math.PI * 2, 0, Math.PI / 2), mat);
      dome.position.z = 0.58;
      const spire = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.3, 8), mat);
      spire.position.z = 1.05;
      group.add(base, body, dome, spire);
      for (const [x, y] of [[-0.48,-0.48],[0.48,-0.48],[-0.48,0.48],[0.48,0.48]]) {
        const t = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.85, 10), mat);
        t.rotation.x = Math.PI / 2;
        t.position.set(x, y, 0.43);
        const cap = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.18, 8), mat);
        cap.position.set(x, y, 0.95);
        group.add(t, cap);
      }
    }

    // 发光底座圆盘
    const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.4, 48), ringMat);
    ring.position.z = 0.01;
    group.add(ring);
    const disc = new THREE.Mesh(new THREE.CircleGeometry(1.1, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.10, side: THREE.DoubleSide }));
    disc.position.z = 0.005;
    group.add(disc);

    // 竖向光柱（让小尺度下也能看见）
    const beamMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.18, depthWrite: false, blending: THREE.AdditiveBlending });
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.35, 6.0, 12, 1, true), beamMat);
    beam.rotation.x = Math.PI / 2;
    beam.position.z = 3.0;
    group.add(beam);

    group.userData.ring = ring;
    group.userData.beam = beam;
    return group;
  },

  render(gl, matrix) {
    const m = new THREE.Matrix4().fromArray(matrix);
    this.camera.projectionMatrix = m;
    this.renderer.resetState();
    this.renderer.render(this.scene, this.camera);
    // 不在此处无条件 triggerRepaint —— 性能优化
  },

  setYear(year) {
    const visible = [];
    for (const b of BUILDINGS) {
      const mesh = this.meshes[b.id];
      if (!mesh) continue;
      const inRange = year >= b.startYear && year <= b.endYear;
      mesh.visible = inRange; // 真正隐藏，不再依赖 opacity
      if (inRange) visible.push(b);
    }
    if (this.map) this.map.triggerRepaint();
    return visible;
  }
};

window._map = map; // 调试用
function _initBuildingLayer() {
  if (map.getLayer && map.getLayer('buildings-3d')) return;
  try {
    map.addLayer(buildingLayer);
    updateYear(parseInt(document.getElementById('time-slider').value, 10));
  } catch (e) { console.error('addLayer failed', e); }
}
if (map.loaded && map.loaded()) {
  _initBuildingLayer();
} else {
  map.on('load', _initBuildingLayer);
  map.once('idle', _initBuildingLayer); // 兜底
}

/* ========== 时间滑块 ========== */
function formatYear(y) {
  return y < 0 ? `公元前 ${Math.abs(y)}` : `公元 ${y}`;
}
function updateYear(year) {
  const txt = formatYear(year);
  document.getElementById('year-display').textContent = txt;
  document.getElementById('year-big').textContent = txt;
  if (buildingLayer.meshes) {
    const visible = buildingLayer.setYear(year);
    document.getElementById('count').textContent = visible.length;
    const list = document.getElementById('building-list');
    if (visible.length === 0) {
      list.innerHTML = '<div class="empty">此时期暂无建筑</div>';
    } else {
      list.innerHTML = visible.map(b => `
        <div class="item" data-id="${b.id}">
          ${b.name}
          <div class="type">${TYPE_CN[b.type] || b.type} · ${formatYear(b.startYear)}</div>
        </div>
      `).join('');
      list.querySelectorAll('.item').forEach(el => {
        el.addEventListener('click', () => {
          const b = BUILDINGS.find(x => x.id === el.dataset.id);
          if (b) map.flyTo({ center: [b.lng, b.lat], zoom: 5.5, pitch: 62, duration: 2000 });
        });
      });
    }
  }
}
document.getElementById('time-slider').addEventListener('input', e => {
  updateYear(parseInt(e.target.value, 10));
});
updateYear(1000);

/* ========== Tooltip：基于经纬度的近距判定 ========== */
const tooltip = document.getElementById('tooltip');
function pickBuilding(point) {
  const year = parseInt(document.getElementById('time-slider').value, 10);
  let best = null, bestDist = Infinity;
  for (const b of BUILDINGS) {
    if (year < b.startYear || year > b.endYear) continue;
    const pt = map.project([b.lng, b.lat]);
    const d = Math.hypot(pt.x - point.x, pt.y - point.y);
    if (d < 50 && d < bestDist) { bestDist = d; best = b; }
  }
  return best;
}
map.on('mousemove', e => {
  const best = pickBuilding(e.point);
  if (best) {
    tooltip.querySelector('.name').textContent = best.name;
    tooltip.querySelector('.meta').textContent = `${TYPE_CN[best.type]} · ${formatYear(best.startYear)} ~ ${formatYear(best.endYear)}`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.originalEvent.clientX + 14) + 'px';
    tooltip.style.top = (e.originalEvent.clientY + 14) + 'px';
    map.getCanvas().style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    map.getCanvas().style.cursor = '';
  }
});
map.on('click', e => {
  const best = pickBuilding(e.point);
  if (best) map.flyTo({ center: [best.lng, best.lat], zoom: 5.5, pitch: 62, duration: 1800 });
});

</script>
